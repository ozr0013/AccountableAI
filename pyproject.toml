[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accountableai"
version = "0.1.0"
description = "Agents that confirm a middleman actually paid your vendors."
requires-python = ">=3.11"
dependencies = [
    "x402[fastapi,evm,requests]>=2.25",   # paid_api: x402 paywall + buyer
    "cdp-sdk>=1.51",                      # paid_api: Coinbase server wallets + faucet
    "pydantic>=2.7",
    "anthropic>=0.40",
    "psycopg[binary]>=3.2",
    "neo4j>=5.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-anthropic>=1.7",
    "reportlab>=4.0",          # world.mess: render messy invoice / statement PDFs
    "pillow>=10.1",            # world.mess: crooked scans
    "pdfplumber>=0.11",        # agents.extract: read PDFs
    "pypdfium2>=4.0",          # agents.extract: page images for OCR / vision
    "pytesseract>=0.3",        # agents.extract: OCR when the tesseract binary is installed
    "pypdf>=5.0",              # agreement_agent: read agreement and invoice PDFs
    "python-multipart>=0.0.9", # agreement_agent.api: file uploads
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["paid_api*", "contracts*", "rails*", "world*", "workflow*", "agents*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["contracts", "evals", "rails", "world", "workflow", "agents", "dashboard/feed/tests", "paid_api"]

[tool.ruff]
line-length = 100
target-version = "py311"
