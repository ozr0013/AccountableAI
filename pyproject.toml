[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accountableai"
version = "0.1.0"
description = "Agents that confirm a middleman actually paid your vendors."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
    "psycopg[binary]>=3.2",
    "neo4j>=5.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-anthropic>=1.7",
]

[project.optional-dependencies]
ingestion = ["pypdf>=5"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["contracts*", "rails*", "world*", "workflow*", "agents*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["contracts", "evals", "rails", "world", "workflow", "agents"]

[tool.ruff]
line-length = 100
target-version = "py311"
