<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Planted bad alert drafts caught, of 8: no verifier 0, code checks only 4, code checks plus Claude verifier 8. Every setup let both true alerts through.">
  <defs>
    <linearGradient id="g8" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5143f4"/><stop offset="1" stop-color="#8b80ff"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa6c2"/><stop offset="1" stop-color="#c3cbdd"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bars">
      <rect x="380" y="206" width="340" height="34" rx="9"/>
      <rect x="380" y="270" width="680" height="34" rx="9"/>
    </clipPath>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sweep { animation: sweep 2.8s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(760px); } }
    .tick { animation: pop 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { 0%, 70%, 100% { transform: scale(1); } 82% { transform: scale(1.2); } }
  </style>
  <rect x="1" y="1" width="1198" height="338" rx="20" fill="#fff" stroke="#dfe7f2" stroke-width="1.5"/>
  <g class="t">
    <text x="48" y="54" font-size="22" font-weight="700" fill="#151d30" letter-spacing="-.4">Planted bad alert drafts the system caught (of 8)</text>
    <text x="48" y="82" font-size="14.5" fill="#566780">Mistakes an LLM agent could make: accusing wording, an uncited claim, a made-up quote, a document that doesn't exist,</text>
    <text x="48" y="102" font-size="14.5" fill="#566780">the wrong document, alerting on a paid invoice, blaming the manager for an allowed holdback or for Oakline's own unfunded invoice.</text>
    <text x="48" y="126" font-size="13.5" fill="#889bb8">Every setup still let both true alerts through. Source: evals/adversarial_results.md</text>

    <g stroke="#edf1f7" stroke-width="1.5">
      <line x1="380" y1="140" x2="380" y2="314"/><line x1="550" y1="140" x2="550" y2="314"/>
      <line x1="720" y1="140" x2="720" y2="314"/><line x1="890" y1="140" x2="890" y2="314"/><line x1="1060" y1="140" x2="1060" y2="314"/>
    </g>
    <g font-size="12" fill="#a3b0c7" text-anchor="middle">
      <text x="380" y="334">0</text><text x="550" y="334">2</text><text x="720" y="334">4</text><text x="890" y="334">6</text><text x="1060" y="334">8</text>
    </g>

    <text x="356" y="165" font-size="16" fill="#394963" text-anchor="end" font-weight="600">No verifier</text>
    <rect x="380" y="142" width="6" height="34" rx="3" fill="#f01448"/>
    <text x="398" y="165" font-size="16" fill="#f01448" font-weight="700">0 / 8 caught</text>

    <text x="356" y="229" font-size="16" fill="#394963" text-anchor="end" font-weight="600">Code checks only</text>
    <rect x="380" y="206" width="340" height="34" rx="9" fill="url(#g4)"/>
    <text x="734" y="229" font-size="16" fill="#394963" font-weight="700">4 / 8</text>

    <text x="356" y="293" font-size="16" fill="#151d30" text-anchor="end" font-weight="700">Code + Claude verifier</text>
    <rect x="380" y="270" width="680" height="34" rx="9" fill="url(#g8)"/>
    <g class="tick"><circle cx="1086" cy="287" r="15" fill="#009e76"/><path d="M1079 287 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="1110" y="293" font-size="16" fill="#151d30" font-weight="700">8 / 8</text>

    <g clip-path="url(#bars)"><rect class="sweep" x="380" y="200" width="150" height="110" fill="url(#shine)"/></g>
  </g>
</svg>
