<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="The closed loop: the owner funds the middleman, the middleman pays the vendor and sends a statement back. The agreement agent checks the agreement, the chaser watches the payment, the anomaly detector checks the statement.">
  <defs>
    <clipPath id="card"><rect width="1200" height="470" rx="20"/></clipPath>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#5143f4" fill-opacity="0.13"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4bdd3"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#182c4d" flood-opacity="0.10"/>
    </filter>
    <!-- money paths -->
    <path id="fund" d="M300 175 L520 175"/>
    <path id="pay" d="M680 175 L900 175"/>
    <path id="stmt" d="M600 248 C 600 330, 230 330, 230 250"/>
    <path id="agree" d="M230 102 C 230 30, 970 30, 970 102"/>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .node rect { fill: #fff; stroke: #dfe7f2; stroke-width: 1.5; }
    .role { font-size: 13px; fill: #889bb8; font-weight: 600; letter-spacing: 1.4px; }
    .name { font-size: 22px; fill: #151d30; font-weight: 700; letter-spacing: -.4px; }
    .sub { font-size: 14px; fill: #566780; }
    .wire { fill: none; stroke: #b4bdd3; stroke-width: 2; stroke-dasharray: 6 7; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -26; } }
    .label { font-size: 14px; fill: #394963; font-weight: 600; }
    .agent rect { fill: #5143f4; }
    .agent text { fill: #fff; font-size: 14px; font-weight: 700; }
    .ring { fill: none; stroke: #5143f4; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ping 3s ease-out infinite; }
    .r2 { animation-delay: 1s; } .r3 { animation-delay: 2s; }
    @keyframes ping { 0% { opacity: .8; transform: scale(.6); } 80%, 100% { opacity: 0; transform: scale(1.6); } }
    .warn { fill: #f01448; }
  </style>
  <rect width="1200" height="470" rx="20" fill="#f7f9fc"/>
  <g clip-path="url(#card)"><rect width="1200" height="470" fill="url(#dots)"/></g>

  <g class="t">
    <!-- the agreement, owner <-> vendor, read by the agreement agent -->
    <use href="#agree" class="wire"/>
    <text x="600" y="24" class="label" text-anchor="middle">the agreement (in the owner's Gmail): who, how much, when, how to pay</text>

    <!-- wires -->
    <use href="#fund" class="wire" marker-end="url(#arrow)"/>
    <use href="#pay" class="wire" marker-end="url(#arrow)"/>
    <use href="#stmt" class="wire" marker-end="url(#arrow)"/>
    <text x="410" y="160" class="label" text-anchor="middle">funds $18,400</text>
    <text x="790" y="160" class="label" text-anchor="middle">pays each invoice</text>
    <text x="415" y="350" class="label" text-anchor="middle">monthly statement: "vendors paid"</text>

    <!-- stakeholders -->
    <g class="node" filter="url(#shadow)">
      <rect x="110" y="108" width="190" height="136" rx="18"/>
      <rect x="520" y="108" width="160" height="136" rx="18"/>
      <rect x="900" y="108" width="190" height="136" rx="18"/>
    </g>
    <text x="205" y="148" class="role" text-anchor="middle">OWNER</text>
    <text x="205" y="181" class="name" text-anchor="middle">Oakline Homes</text>
    <text x="205" y="210" class="sub" text-anchor="middle">60 rental homes</text>
    <text x="600" y="148" class="role" text-anchor="middle">MIDDLEMAN</text>
    <text x="600" y="181" class="name" text-anchor="middle">Keyway</text>
    <text x="600" y="210" class="sub" text-anchor="middle">property manager</text>
    <text x="995" y="148" class="role" text-anchor="middle">VENDOR</text>
    <text x="995" y="181" class="name" text-anchor="middle">Rio Grande</text>
    <text x="995" y="210" class="sub" text-anchor="middle">plumber, $1,240</text>

    <!-- money moving -->
    <g>
      <circle r="9" fill="#009e76"><animateMotion dur="2.6s" repeatCount="indefinite" rotate="0"><mpath href="#fund"/></animateMotion></circle>
      <text font-size="11" font-weight="800" fill="#fff" text-anchor="middle" dy="4">$<animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#fund"/></animateMotion></text>
    </g>
    <g>
      <circle r="9" fill="#009e76" opacity="0.35"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#pay"/></animateMotion></circle>
      <text font-size="11" font-weight="800" fill="#fff" text-anchor="middle" dy="4" opacity="0.6">?<animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#pay"/></animateMotion></text>
    </g>
    <g>
      <rect x="-13" y="-9" width="26" height="18" rx="3" fill="#fff" stroke="#5143f4" stroke-width="1.6"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#stmt"/></animateMotion></rect>
    </g>
    <g>
      <rect x="-12" y="-8" width="24" height="16" rx="3" fill="#fff" stroke="#db7b00" stroke-width="1.6"><animateMotion dur="4.4s" repeatCount="indefinite"><mpath href="#agree"/></animateMotion></rect>
    </g>

    <!-- the three agents, each watching its step -->
    <g class="agent">
      <circle class="ring" cx="600" cy="76" r="26"/>
      <rect x="512" y="62" width="176" height="30" rx="15"/>
      <text x="600" y="82" text-anchor="middle">① Agreement agent</text>
    </g>
    <g class="agent">
      <circle class="ring r2" cx="790" cy="206" r="26"/>
      <rect x="712" y="192" width="156" height="30" rx="15"/>
      <text x="790" y="212" text-anchor="middle">② Chaser agent</text>
    </g>
    <g class="agent">
      <circle class="ring r3" cx="415" cy="306" r="26"/>
      <rect x="322" y="292" width="186" height="30" rx="15"/>
      <text x="415" y="312" text-anchor="middle">③ Anomaly detector</text>
    </g>

    <!-- what each one does -->
    <g font-size="14" fill="#566780">
      <text x="110" y="395"><tspan font-weight="700" fill="#151d30">① Agreement agent:</tspan> is the agreement complete? Store it, or tell the owner what's missing.</text>
      <text x="110" y="420"><tspan font-weight="700" fill="#151d30">② Chaser:</tspan> due date passed with no bank or vendor proof? Remind the middleman, then escalate to the owner.</text>
      <text x="110" y="445"><tspan font-weight="700" fill="#151d30">③ Anomaly detector:</tspan> statement says <tspan class="warn" font-weight="700">$620</tspan> for an invoice approved at $1,240? Alert the owner, email the middleman.</text>
    </g>
  </g>
</svg>
